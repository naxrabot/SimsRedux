<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>The Sims Redux</title>
    <base href="./" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="SimsRedux.Web.styles.css" rel="stylesheet" />
</head>

<body>

    <div id="app">
        <div id="loading" style="display: table-cell; margin: auto; width:100vw; height:100vh; vertical-align: middle; background: #000052;">
            <div style="display: block; margin: auto; width: 9em; color: white;font-family: 'Segoe UI', sans-serif;">
                <div style="text-align: center; font-size: 1.2em;">The Sims Redux</div>
                <div style="text-align: center; font-size: 1.8em;">loading&nbsp;<marquee style="width:0.9em; vertical-align: bottom;">.&nbsp;.&nbsp;.&nbsp;&nbsp;&nbsp;</marquee></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module">
        import { BrotliDecode } from './js/decode.min.js';
        window.BrotliDecode = BrotliDecode;
        // Set this to enable Brotli (.br) decompression on static webServers
        // that don't support content compression and http://.
        var enableBrotliDecompression = false;
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity)
            {
                if (enableBrotliDecompression === true && type !== 'dotnetjs' && location.hostname !== 'localhost')
                {
                    return (async function()
                    {
                        const response = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                        if (!response.ok)
                            throw new Error(response.statusText);
                        const originalResponseBuffer = await response.arrayBuffer();
                        const originalResponseArray = new Int8Array(originalResponseBuffer);
                        const contentType = (type === 'dotnetwasm')
                                          ? 'application/wasm'
                                          : 'application/octet-stream';
                        const decompressedResponseArray = BrotliDecode(originalResponseArray);
                        return new Response(decompressedResponseArray,
                                            { headers: { 'content-type': contentType }
                                   });
                    })();
                }
            }
        });
    </script>

    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>

    <script src="js/simsfs.js"></script>
    <script>
        function tickJS()
        {
            window.theInstance.invokeMethod('TickDotNet');
            window.requestAnimationFrame(tickJS);
        }

        window.simsReduxCrashed = (message) =>
        {
            var box = document.createElement('div');
            box.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:1001;background:#000052;color:#ffb0a0;border:2px solid #7878c8;padding:12px 16px;font:14px Segoe UI,sans-serif';
            box.textContent = 'Something went wrong and the game stopped: ' + message + ' (details are in the browser console, F12).';
            document.body.appendChild(box);
        };

        window.initRenderJS = (instance) =>
        {
            window.theInstance = instance;

            // set initial canvas size
            var canvas = document.getElementById('theCanvas');
            var holder = document.getElementById('canvasHolder');
            canvas.width = holder.clientWidth;
            canvas.height = holder.clientHeight;
            // disable context menu on right click
            canvas.addEventListener("contextmenu", e => e.preventDefault());

            // first make sure the player's Sims files are here (asks for the folder the first time),
            // then begin the game loop
            SimsFS.prepare().then(() => window.requestAnimationFrame(tickJS));
        };

        window.addEventListener("keydown", function(event)
        {
            // Prevent Arrows Keys and Spacebar scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1)
                event.preventDefault();
        });
        window.addEventListener("wheel", function(event)
        {
            // Prevent Mousewheel scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            event.preventDefault();
        }, { passive: false });
    </script>
</body>

</html>

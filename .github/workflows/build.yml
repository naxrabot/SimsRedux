name: Build

# Builds the Windows game on every push to the browser-port branch (and when run by hand),
# so compile errors show up here instead of on Joey's PC.
on:
  push:
    branches: [ browser-port ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Get the code (with the FreeSO submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build the Windows game
        id: build
        shell: pwsh
        run: |
          dotnet build Client/Simitone/Simitone.Windows/Simitone.Windows.csproj -c Release -v minimal -clp:NoSummary 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          # unique compile errors, one per line, for the steps below to report
          Select-String -Path build.log -Pattern ': error ' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Set-Content errors.txt
          "Errors: $((Get-Content errors.txt | Measure-Object -Line).Lines)"
          exit $code

      # GitHub shows at most 10 errors per step, so the list is reported in chunks of 10.
      - name: Errors 1-10
        if: failure()
        shell: pwsh
        run: Get-Content errors.txt | Select-Object -First 10 | ForEach-Object { "::error::$_" }
      - name: Errors 11-20
        if: failure()
        shell: pwsh
        run: Get-Content errors.txt | Select-Object -Skip 10 -First 10 | ForEach-Object { "::error::$_" }
      - name: Errors 21-30
        if: failure()
        shell: pwsh
        run: Get-Content errors.txt | Select-Object -Skip 20 -First 10 | ForEach-Object { "::error::$_" }
      - name: Errors 31-40
        if: failure()
        shell: pwsh
        run: Get-Content errors.txt | Select-Object -Skip 30 -First 10 | ForEach-Object { "::error::$_" }

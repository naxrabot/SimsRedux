name: Build

# Builds the Windows game on every push to the browser-port branch (and when run by hand),
# so compile errors show up here instead of on Joey's PC, then builds and publishes the website.
#
# Where it runs (two repository variables, Settings > Secrets and variables > Actions > Variables):
#   RUNNER    unset = GitHub's own Windows machines; "self-hosted" = Joey's PC (GitHub's runner
#             program installed there - builds there are free and have no time limit)
#   SITE_DIR  unset = the website goes to GitHub Pages (the web-build branch);
#             a folder on Joey's PC (e.g. C:\SimsRedux\site) = it goes there, and Joey's
#             SimsRedux server serves it at tsr.mbrew.studio through his Cloudflare tunnel
on:
  push:
    branches: [ browser-port ]
  workflow_dispatch:

# one build at a time (a newer push waits for the one before it to finish publishing)
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ${{ vars.RUNNER || 'windows-latest' }}
    steps:
      - name: Get the code (with the FreeSO submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # (on Joey's PC, .NET is already installed)
      - name: Install .NET 9
        if: ${{ !vars.RUNNER }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build the Windows game
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          # warnings would fill GitHub's annotation limit, so only our error list is reported
          "::remove-matcher owner=csc::"
          "::remove-matcher owner=msbuild::"
          dotnet build Client/Simitone/Simitone.Windows/Simitone.Windows.csproj -c Release -v minimal -clp:NoSummary 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          # unique compile errors, one per line, for the steps below to report
          Select-String -Path build.log -Pattern ': error ' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Set-Content errors.txt
          "Errors: $((Get-Content errors.txt | Measure-Object -Line).Lines)"
          if (-not (Test-Path errors.txt)) { New-Item errors.txt -ItemType File | Out-Null }
          exit $code

      - name: Build the dedicated server
        shell: pwsh
        run: |
          dotnet build Client/Server/SimsRedux.Server/SimsRedux.Server.csproj -c Release -v minimal -clp:NoSummary 2>&1 | Tee-Object -FilePath server.log
          if ($LASTEXITCODE -ne 0) { Select-String -Path server.log -Pattern ': error ' | ForEach-Object { "::error::$($_.Line.Trim())" } | Select-Object -First 10; exit 1 }

      - name: Test the server panel
        shell: pwsh
        run: |
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) { "Node.js isn't installed here - panel test skipped"; exit 0 }
          node Client/Server/Panel/test-core.mjs

      - name: Build and test the Sims Redux Creator
        shell: pwsh
        run: |
          dotnet build Client/Creator/SimsRedux.Creator/SimsRedux.Creator.csproj -c Release -v minimal -clp:NoSummary 2>&1 | Tee-Object -FilePath creator.log
          if ($LASTEXITCODE -ne 0) { Select-String -Path creator.log -Pattern ': error ' | ForEach-Object { "::error::$($_.Line.Trim())" } | Select-Object -First 10; exit 1 }
          dotnet run --project Client/Creator/SimsRedux.Creator.Tests/SimsRedux.Creator.Tests.csproj -c Release -- "$env:RUNNER_TEMP/creator-previews"
          if ($LASTEXITCODE -ne 0) { "::error::Creator tests failed"; exit 1 }

      # GitHub shows at most 10 errors per step, so the list is reported in chunks of 10.
      - name: Errors 1-10
        if: failure()
        shell: pwsh
        run: Get-Content errors.txt | Select-Object -First 10 | ForEach-Object { "::error::$_" }
      - name: Errors 11-20
        if: failure()
        shell: pwsh
        run: Get-Content errors.txt | Select-Object -Skip 10 -First 10 | ForEach-Object { "::error::$_" }
      - name: Errors 21-30
        if: failure()
        shell: pwsh
        run: Get-Content errors.txt | Select-Object -Skip 20 -First 10 | ForEach-Object { "::error::$_" }
      - name: Errors 31-40
        if: failure()
        shell: pwsh
        run: Get-Content errors.txt | Select-Object -Skip 30 -First 10 | ForEach-Object { "::error::$_" }

  web:
    runs-on: ${{ vars.RUNNER || 'windows-latest' }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Get the code (with the FreeSO submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET 10
        if: ${{ !vars.RUNNER }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the web version
        shell: bash
        run: |
          echo "::remove-matcher owner=csc::"
          echo "::remove-matcher owner=msbuild::"
          set +e
          dotnet build Client/Simitone/Simitone.Web/Simitone.Web.csproj -c Release -v minimal -clp:NoSummary > build.log 2>&1
          code=$?
          grep -E 'error ' build.log | sed -E 's#/home/runner/work/SimsRedux/SimsRedux/##g' | sed -E 's# \[[^]]*\.csproj\]$##' | cut -c1-400 | sort -u > errors.txt
          echo "Errors: $(wc -l < errors.txt)"
          grep -oE 'error [A-Z]+[0-9]+' errors.txt | sort | uniq -c | sort -rn | head -20
          exit $code

      # The website is the fast (ahead-of-time compiled) version: much faster game code.
      # It's published to the web-build branch, which GitHub Pages serves at tsr.mbrew.studio.
      - name: Install the WebAssembly build tools
        shell: bash
        run: |
          if dotnet workload list 2>/dev/null | grep -q wasm-tools; then echo "already installed"; exit 0; fi
          dotnet workload install wasm-tools > workload.log 2>&1 && exit 0
          tail -20 workload.log
          echo "::error::The WebAssembly build tools aren't installed. On a self-hosted PC, run once in an Administrator terminal: dotnet workload install wasm-tools"
          exit 1

      - name: Publish the website (fast version)
        shell: bash
        run: |
          sed -i "s/__BUILD__/$(date -u +%m%d-%H%M)-${GITHUB_SHA::7}/" Client/Simitone/Simitone.Web/wwwroot/index.html
          # AOT needs trimming; the game's own assemblies are rooted in the csproj so only .NET's libraries (and Common.Logging) get trimmed
          dotnet publish Client/Simitone/Simitone.Web/Simitone.Web.csproj -c Release -v minimal -clp:NoSummary -o publish \
            -p:RunAOTCompilation=true -p:PublishTrimmed=true -p:TrimMode=full -p:SuppressTrimAnalysisWarnings=true > publish.log 2>&1 \
            || { grep -E 'error ' publish.log | sort -u | head -20 | while read -r l; do echo "::error::$l"; done; exit 1; }
          grep -i "SimsRedux:" publish.log | while read -r l; do echo "::warning::$l"; done
          echo "::warning::shaders: $(ls publish/wwwroot/Content/Web/Effects | wc -l), content files: $(find publish/wwwroot/Content -type f | wc -l)"
          echo "::warning::$(dotnet run Client/Tools/BundleContent/BundleContent.cs -- publish/wwwroot/Content)"
          # old /fast/ links go to the main site now
          mkdir -p publish/wwwroot/fast
          printf '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../"><a href="../">The Sims Redux</a>\n' > publish/wwwroot/fast/index.html
          rm -f publish/wwwroot/.gitignore
          # the version the game checks for "New update available" (js/simsfs.js)
          ver=$(grep -oE 'Number = "[0-9.]+"' Client/Simitone/Simitone.Client/Utils/ReduxBuild.cs | grep -oE '[0-9.]+')
          printf '{"version":"%s","build":"%s"}\n' "$ver" "${GITHUB_SHA::7}" > publish/wwwroot/version.json
          echo "::warning::website version $ver"

      # Joey's PC: straight into the site folder his server serves (the old copy is swapped out at once)
      - name: Publish to this PC's site folder
        if: ${{ vars.SITE_DIR }}
        shell: pwsh
        run: |
          $site = "${{ vars.SITE_DIR }}".TrimEnd('\','/')
          $new = "$site.new"; $old = "$site.old"
          if (Test-Path $new) { Remove-Item $new -Recurse -Force }
          Copy-Item publish/wwwroot $new -Recurse
          # the backup (/classic) stays until its own job replaces it
          if (Test-Path "$site/classic") { Copy-Item "$site/classic" "$new/classic" -Recurse }
          if (Test-Path $old) { Remove-Item $old -Recurse -Force -ErrorAction SilentlyContinue }
          for ($i = 0; $i -lt 10; $i++) {
            try {
              if (Test-Path $site) { Rename-Item $site (Split-Path $old -Leaf) -ErrorAction Stop }
              Rename-Item $new (Split-Path $site -Leaf) -ErrorAction Stop
              break
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not (Test-Path "$site/index.html")) { "::error::Couldn't swap the new website into $site"; exit 1 }
          Remove-Item $old -Recurse -Force -ErrorAction SilentlyContinue
          $mb = [int]((Get-ChildItem $site -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          "::warning::Website published to $site ($mb MB)"

      - name: Publish to GitHub Pages
        if: ${{ !vars.SITE_DIR }}
        shell: bash
        run: |
          cd publish/wwwroot
          # the pre-compressed copies of the game's code (.br/.gz) aren't used here: GitHub Pages compresses as it sends
          find _framework _content -type f \( -name '*.br' -o -name '*.gz' \) -delete 2>/dev/null || true
          touch .nojekyll
          echo "tsr.mbrew.studio" > CNAME   # GitHub Pages serves the branch at this address
          git init -q -b web-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build of ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" web-build
          echo "::warning::Published $(du -sh . | cut -f1)"

      - name: Errors 1-10
        if: failure()
        shell: bash
        run: head -n 10 errors.txt | while read -r l; do echo "::error::$l"; done
      - name: Errors 11-20
        if: failure()
        shell: bash
        run: sed -n '11,20p' errors.txt | while read -r l; do echo "::error::$l"; done
      - name: Errors 21-30
        if: failure()
        shell: bash
        run: sed -n '21,30p' errors.txt | while read -r l; do echo "::error::$l"; done
      - name: Errors 31-40
        if: failure()
        shell: bash
        run: sed -n '31,40p' errors.txt | while read -r l; do echo "::error::$l"; done
      - name: Error summary
        if: failure()
        shell: bash
        run: |
          echo "::warning::Total errors: $(wc -l < errors.txt)"
          grep -oE 'error [A-Z]+[0-9]+' errors.txt | sort | uniq -c | sort -rn | head -8 | while read -r l; do echo "::warning::$l"; done

  # The normal (not ahead-of-time compiled) version, kept at /classic/ as a backup in case the
  # fast version ever breaks. Published after the main site so it never holds that up.
  web-classic:
    needs: web
    runs-on: ${{ vars.RUNNER || 'windows-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Get the code (with the FreeSO submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET 10
        if: ${{ !vars.RUNNER }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish the classic web version
        shell: bash
        run: |
          sed -i "s/__BUILD__/classic-$(date -u +%m%d-%H%M)-${GITHUB_SHA::7}/" Client/Simitone/Simitone.Web/wwwroot/index.html
          dotnet publish Client/Simitone/Simitone.Web/Simitone.Web.csproj -c Release -v minimal -clp:NoSummary -o publish > publish.log 2>&1 \
            || { grep -E 'error ' publish.log | sort -u | head -20 | while read -r l; do echo "::error::$l"; done; exit 1; }
          ver=$(grep -oE 'Number = "[0-9.]+"' Client/Simitone/Simitone.Client/Utils/ReduxBuild.cs | grep -oE '[0-9.]+')
          printf '{"version":"%s","build":"%s"}\n' "$ver" "${GITHUB_SHA::7}" > publish/wwwroot/version.json
          echo "::warning::classic version: $(du -sh publish/wwwroot | cut -f1)"

      - name: Add it to this PC's site folder as /classic/
        if: ${{ vars.SITE_DIR }}
        shell: pwsh
        run: |
          $site = "${{ vars.SITE_DIR }}".TrimEnd('\','/')
          $tmp = "$site/classic.new"
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Copy-Item publish/wwwroot $tmp -Recurse
          Remove-Item "$tmp/.gitignore" -ErrorAction SilentlyContinue
          # the game content is the same as the main site's, which this copy uses (js/simsfs.js)
          Get-ChildItem "$tmp/Content" | Where-Object { $_.Name -ne 'Web' } | Remove-Item -Recurse -Force
          if (Test-Path "$site/classic") { Remove-Item "$site/classic" -Recurse -Force }
          Rename-Item $tmp "classic"
          "::warning::classic copy published to $site/classic"

      - name: Add it to the website as /classic/
        if: ${{ !vars.SITE_DIR }}
        shell: bash
        run: |
          git clone -q --depth 1 -b web-build "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" site
          rm -rf site/classic
          cp -r publish/wwwroot site/classic
          rm -f site/classic/.gitignore
          # the game content is the same as the main site's, which this copy uses (js/simsfs.js), so it isn't kept twice
          find site/classic/Content -mindepth 1 -maxdepth 1 ! -name Web -exec rm -rf {} +
          find site/classic/_framework site/classic/_content -type f \( -name '*.br' -o -name '*.gz' \) -delete 2>/dev/null || true
          echo "::warning::classic copy without its own content: $(du -sh site/classic | cut -f1)"
          cd site
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Classic web build of ${GITHUB_SHA}"
          git push -q origin web-build
